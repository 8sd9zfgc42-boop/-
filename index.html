<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Space Battle</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #241041 0%, #090714 45%, #020207 100%);
      color: #d8f6ff;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      overflow-x: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button, canvas, input {
      font-family: 'Press Start 2P', monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 10px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 18px;
      color: #7ef7ff;
      text-shadow: 0 0 12px rgba(126,247,255,0.7);
    }

    #subText {
      font-size: 9px;
      line-height: 1.8;
      color: #bfefff;
      margin-bottom: 10px;
    }

    #canvasWrap {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 880px;
    }

    #gameCanvas {
      width: 100%;
      max-width: 880px;
      height: auto;
      display: block;
      margin: 0 auto;
      background: #040814;
      border: 4px solid #86fbff;
      box-shadow: 0 0 0 4px #14233f, 0 0 18px rgba(133,251,255,0.45);
      image-rendering: pixelated;
    }

    #scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 2px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0) 4px
      );
      mix-blend-mode: soft-light;
    }

    #message {
      min-height: 30px;
      margin: 12px auto 8px;
      color: #ffe57e;
      font-size: 10px;
      line-height: 1.6;
      max-width: 880px;
    }

    #touchControls {
      margin: 12px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 720px;
    }

    #touchControls button {
      min-height: 58px;
      font-size: 11px;
      border: 3px solid #79f4ff;
      background: linear-gradient(180deg, #352868 0%, #17132f 100%);
      color: #fff;
      box-shadow: 0 0 0 2px #120c28 inset;
      cursor: pointer;
    }

    #okBtn {
      border-color: #ffe57e !important;
      background: linear-gradient(180deg, #6a5615 0%, #2b240c 100%) !important;
      color: #fff7c2 !important;
    }

    #pauseBtn {
      border-color: #ffb3cf !important;
      background: linear-gradient(180deg, #7f2c4c 0%, #311220 100%) !important;
    }

    #help {
      margin-top: 12px;
      font-size: 8px;
      line-height: 1.8;
      color: #9ddfff;
      max-width: 880px;
      margin-left: auto;
      margin-right: auto;
    }

    footer {
      margin: 18px 0 10px;
      font-size: 8px;
      color: #7ab9d8;
    }

    @media (max-width: 700px) {
      h1 { font-size: 15px; }
      #touchControls button { font-size: 10px; min-height: 52px; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>PIXEL SPACE BATTLE</h1>
    <div id="subText">
      SINGLE / NORMAL MATCH / ROOM MATCH / RP RANK / ITEM DROP / ENEMY SHOT
    </div>

    <div id="canvasWrap">
      <canvas id="gameCanvas" width="880" height="520"></canvas>
      <div id="scanlines"></div>
    </div>

    <div id="message">TITLE MENU</div>

    <div id="touchControls">
      <button id="leftBtn">◀ LEFT</button>
      <button id="rightBtn">RIGHT ▶</button>
      <button id="actionBtn">ACTION</button>
      <button id="specialBtn">SPECIAL</button>
      <button id="okBtn">OK</button>
      <button id="pauseBtn">PAUSE</button>
    </div>

    <div id="help">
      MENU: LEFT / RIGHT / OK<br>
      SINGLE: LEFT / RIGHT / ACTION / SPECIAL / PAUSE<br>
      VS: NORMAL MATCH HAS RP RANK SYSTEM
    </div>

    <footer>PIXEL SPACE BATTLE / CLEAN UI EDITION</footer>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const messageEl = document.getElementById("message");

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const actionBtn = document.getElementById("actionBtn");
    const specialBtn = document.getElementById("specialBtn");
    const okBtn = document.getElementById("okBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const PLAYER_NAME_KEY = "pixel_space_battle_player_name";
    const RANK_DATA_KEY = "pixel_space_battle_rank_data";

    let keys = {};
    let stars = [];
    let items = [];
    let particles = [];
    let enemyBullets = [];
    let playerBullets = [];

    let audioCtx = null;
    let audioUnlocked = false;

    let gameState = "title";
    let previousStateBeforePause = "title";

    let titleMenuIndex = 0;
    let vsMenuIndex = 0;
    let roomMenuIndex = 0;
    let pauseMenuIndex = 0;
    let resultTimer = 0;

    let playerName = "PLAYER";

    let singlePlayer = null;
    let singleEnemies = [];
    let singleScore = 0;
    let singleLives = 3;
    let singleHp = 100;
    let singleLastShot = 0;
    let singleEnemyDir = 1;
    let singleSpecial = 1;
    let singleInvincible = 0;

    let normalVs = null;
    let roomWaitData = null;
    let roomBattleData = null;

    const rankDefs = [
      { name: "BEGINNER", min: 0, color: "#8f99a8", accent: "#eef3ff", shape: "hex" },
      { name: "BRONZE", min: 100, color: "#b87333", accent: "#f0be8f", shape: "bronze" },
      { name: "SILVER", min: 220, color: "#c7d2dd", accent: "#ffffff", shape: "shield" },
      { name: "GOLD", min: 380, color: "#ffd84d", accent: "#fff7b0", shape: "crown" },
      { name: "PLATINUM", min: 580, color: "#9fe8ff", accent: "#ecffff", shape: "crystal" },
      { name: "DIAMOND", min: 820, color: "#39d8ff", accent: "#dbf9ff", shape: "diamond" },
      { name: "MASTER", min: 1150, color: "#b04cff", accent: "#ffd45c", shape: "winged" }
    ];

    let rankData = {
      rp: 0,
      wins: 0,
      loses: 0,
      streak: 0
    };

    const PLAYER_SPRITE = [
      "00011000","00111100","01111110","11111111",
      "11011011","00100100","01000010","10100101"
    ];

    const ENEMY_SPRITE = [
      "00111100","01111110","11111111","11011011",
      "11111111","00100100","01000010","10000001"
    ];

    function loadPlayerData() {
      const savedName = localStorage.getItem(PLAYER_NAME_KEY);
      if (savedName) playerName = savedName;

      const savedRank = localStorage.getItem(RANK_DATA_KEY);
      if (savedRank) {
        try {
          rankData = JSON.parse(savedRank);
        } catch (e) {}
      }
    }

    function saveRankData() {
      localStorage.setItem(RANK_DATA_KEY, JSON.stringify(rankData));
    }

    function getCurrentRank(rp) {
      let current = rankDefs[0];
      for (const rank of rankDefs) {
        if (rp >= rank.min) current = rank;
      }
      return current;
    }

    function createBackground() {
      stars = [];
      for (let i = 0; i < 75; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() < 0.7 ? 2 : 3,
          speed: 0.15 + Math.random() * 0.4,
          color: Math.random() < 0.7 ? "#c8f7ff" : "#8f9bff"
        });
      }
    }

    function updateBackground() {
      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = -4;
          star.x = Math.random() * canvas.width;
        }
      });
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, "#110825");
      bg.addColorStop(0.45, "#141c52");
      bg.addColorStop(1, "#05101d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#3ff8ff";
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(690, 92, 34, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#704dff";
      ctx.globalAlpha = 0.18;
      ctx.fillRect(635, 78, 125, 10);
      ctx.fillRect(650, 90, 145, 8);
      ctx.fillRect(615, 105, 105, 8);

      ctx.globalAlpha = 1;
      stars.forEach(star => {
        ctx.fillStyle = star.color;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      });
    }

    function setupAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      audioUnlocked = true;
    }

    function unlockAudioOnce() {
      if (!audioUnlocked) setupAudio();
    }

    function beep(freq = 440, duration = 0.08, type = "square", volume = 0.03, slide = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide !== 0) {
        osc.frequency.linearRampToValueAtTime(freq + slide, audioCtx.currentTime + duration);
      }

      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCursorSound() { beep(520, 0.04, "square", 0.018, 20); }
    function playDecisionSound() {
      beep(660, 0.06, "square", 0.03, 40);
      setTimeout(() => beep(880, 0.08, "square", 0.03, 50), 50);
    }
    function playShootSound() { beep(720, 0.04, "square", 0.018, -120); }
    function playEnemyShootSound() { beep(300, 0.05, "square", 0.018, -40); }
    function playHitSound() {
      beep(220, 0.08, "square", 0.04, 100);
      setTimeout(() => beep(180, 0.06, "square", 0.03, -80), 30);
    }
    function playItemSound() {
      beep(940, 0.08, "triangle", 0.04, 40);
      setTimeout(() => beep(1180, 0.09, "triangle", 0.04, 60), 60);
    }
    function playSpecialSound() {
      beep(880, 0.12, "square", 0.05, 120);
      setTimeout(() => beep(660, 0.12, "square", 0.05, 80), 80);
      setTimeout(() => beep(440, 0.18, "triangle", 0.05, -60), 160);
    }
    function playPauseSound() { beep(320, 0.08, "triangle", 0.03, -20); }
    function playResumeSound() { beep(420, 0.08, "triangle", 0.03, 30); }
    function playWinSound() {
      beep(660, 0.08, "square", 0.03, 50);
      setTimeout(() => beep(880, 0.08, "square", 0.03, 60), 80);
      setTimeout(() => beep(1180, 0.12, "triangle", 0.04, 0), 160);
    }
    function playLoseSound() {
      beep(320, 0.12, "square", 0.03, -30);
      setTimeout(() => beep(260, 0.12, "square", 0.03, -30), 90);
      setTimeout(() => beep(190, 0.18, "triangle", 0.04, -20), 180);
    }

    function drawPixelSprite(sprite, x, y, pixelSize, color, shadowColor = null) {
      if (shadowColor) {
        ctx.fillStyle = shadowColor;
        for (let row = 0; row < sprite.length; row++) {
          for (let col = 0; col < sprite[row].length; col++) {
            if (sprite[row][col] === "1") {
              ctx.fillRect(x + col * pixelSize + 2, y + row * pixelSize + 2, pixelSize, pixelSize);
            }
          }
        }
      }
      ctx.fillStyle = color;
      for (let row = 0; row < sprite.length; row++) {
        for (let col = 0; col < sprite[row].length; col++) {
          if (sprite[row][col] === "1") {
            ctx.fillRect(x + col * pixelSize, y + row * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function rectHit(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function moveMenu(current, min, max, dir) {
      current += dir;
      if (current < min) current = max;
      if (current > max) current = min;
      return current;
    }

    function addParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: 2 + Math.random() * 2,
          life: 20 + Math.random() * 20,
          color
        });
      }
    }

    function updateParticles() {
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1;
    }

    function createEnemyGrid() {
      singleEnemies = [];
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 10; col++) {
          singleEnemies.push({
            x: 95 + col * 62,
            y: 70 + row * 38,
            width: 24,
            height: 24,
            alive: true,
            shotCooldown: 40 + Math.random() * 120
          });
        }
      }
    }

    function initSingleMode() {
      singlePlayer = {
        x: canvas.width / 2 - 16,
        y: 430,
        width: 32,
        height: 32,
        speed: 6
      };
      playerBullets = [];
      enemyBullets = [];
      items = [];
      particles = [];
      singleScore = 0;
      singleLives = 3;
      singleHp = 100;
      singleLastShot = 0;
      singleEnemyDir = 1;
      singleSpecial = 1;
      singleInvincible = 0;
      createEnemyGrid();
    }

    function startSingleMode() {
      initSingleMode();
      gameState = "single";
      messageEl.textContent = "1 PLAYER START";
      playDecisionSound();
    }

    function startVsMenu() {
      gameState = "vs_menu";
      vsMenuIndex = 0;
      messageEl.textContent = "SELECT VS MODE";
      playDecisionSound();
    }

    function startNormalMatch() {
      gameState = "normal_vs";
      normalVs = {
        leftX: 140,
        rightX: 660,
        leftY: 340,
        rightY: 140,
        leftHp: 100,
        rightHp: 100,
        leftGauge: 35,
        rightGauge: 68,
        timer: 99,
        battleTimer: 0,
        result: null,
        rpDelta: 0
      };
      messageEl.textContent = "NORMAL MATCH START";
      playDecisionSound();
    }

    function startRoomMenu() {
      gameState = "room_menu";
      roomMenuIndex = 0;
      messageEl.textContent = "ROOM MATCH MENU";
      playDecisionSound();
    }

    function createRoomFlow() {
      gameState = "room_wait";
      roomWaitData = {
        roomId: Math.random().toString(36).slice(2, 8).toUpperCase(),
        hostName: playerName,
        guestName: "WAITING...",
        hostReady: false,
        guestReady: false,
        blink: 0
      };
      messageEl.textContent = "ROOM CREATED";
      playDecisionSound();
    }

    function joinRoomFlow() {
      gameState = "room_wait";
      roomWaitData = {
        roomId: "JOIN-" + Math.random().toString(36).slice(2, 6).toUpperCase(),
        hostName: "HOST PLAYER",
        guestName: playerName,
        hostReady: true,
        guestReady: false,
        blink: 0
      };
      messageEl.textContent = "JOINED ROOM";
      playDecisionSound();
    }

    function startRoomBattleDemo() {
      gameState = "room_battle";
      roomBattleData = {
        leftName: playerName,
        rightName: "RIVAL",
        leftHp: 100,
        rightHp: 100,
        leftGauge: 24,
        rightGauge: 52,
        leftX: 120,
        leftY: 330,
        rightX: 640,
        rightY: 160,
        timer: 99
      };
      messageEl.textContent = "ROOM MATCH START";
      playDecisionSound();
    }

    function pauseGame() {
      if (!["single","normal_vs","room_wait","room_battle"].includes(gameState)) return;
      previousStateBeforePause = gameState;
      gameState = "paused";
      pauseMenuIndex = 0;
      playPauseSound();
      messageEl.textContent = "PAUSED";
    }

    function resumeGame() {
      gameState = previousStateBeforePause;
      playResumeSound();
      messageEl.textContent = "RESUMED";
    }

    function retryCurrentMode() {
      playDecisionSound();
      if (previousStateBeforePause === "single" || gameState === "single") startSingleMode();
      else if (previousStateBeforePause === "normal_vs" || gameState === "normal_vs") startNormalMatch();
      else if (previousStateBeforePause === "room_wait" || gameState === "room_wait") createRoomFlow();
      else if (previousStateBeforePause === "room_battle" || gameState === "room_battle") startRoomBattleDemo();
    }

    function dropItem(x, y) {
      const roll = Math.random();
      let type = null;
      if (roll < 0.15) type = "heal";
      else if (roll < 0.27) type = "special";
      else if (roll < 0.42) type = "score";
      if (!type) return;

      items.push({
        x,
        y,
        width: 18,
        height: 18,
        type,
        vy: 1.5
      });
    }

    function updateItems() {
      items.forEach(item => {
        item.y += item.vy;
      });

      items.forEach(item => {
        if (rectHit(item, singlePlayer)) {
          if (item.type === "heal") {
            singleHp = Math.min(100, singleHp + 25);
            messageEl.textContent = "ITEM: HP UP";
          } else if (item.type === "special") {
            singleSpecial++;
            messageEl.textContent = "ITEM: SPECIAL +1";
          } else if (item.type === "score") {
            singleScore += 50;
            messageEl.textContent = "ITEM: SCORE +50";
          }
          addParticles(item.x + 8, item.y + 8, "#ffe57e", 12);
          playItemSound();
          item.y = canvas.height + 100;
        }
      });

      items = items.filter(item => item.y < canvas.height + 30);
    }

    function updateSingleMode() {
      updateBackground();
      updateParticles();

      if (singleInvincible > 0) singleInvincible--;

      if (keys["ArrowLeft"] && singlePlayer.x > 10) singlePlayer.x -= singlePlayer.speed;
      if (keys["ArrowRight"] && singlePlayer.x + singlePlayer.width < canvas.width - 10) singlePlayer.x += singlePlayer.speed;

      const now = Date.now();
      if (keys["Space"] || keys["KeyZ"]) {
        if (now - singleLastShot > 180) {
          playerBullets.push({
            x: singlePlayer.x + singlePlayer.width / 2 - 2,
            y: singlePlayer.y - 8,
            width: 4,
            height: 12,
            speed: 8
          });
          singleLastShot = now;
          playShootSound();
        }
      }

      playerBullets.forEach(b => b.y -= b.speed);
      playerBullets = playerBullets.filter(b => b.y > -20);

      let hitEdge = false;
      singleEnemies.forEach(e => {
        if (!e.alive) return;
        e.x += 0.6 * singleEnemyDir;
        e.shotCooldown--;

        if (e.shotCooldown <= 0) {
          enemyBullets.push({
            x: e.x + 10,
            y: e.y + 16,
            width: 4,
            height: 10,
            speed: 3.8 + Math.random() * 1.2
          });
          e.shotCooldown = 70 + Math.random() * 140;
          playEnemyShootSound();
        }

        if (e.x <= 20 || e.x + e.width >= canvas.width - 20) hitEdge = true;
      });

      if (hitEdge) {
        singleEnemyDir *= -1;
        singleEnemies.forEach(e => {
          if (e.alive) e.y += 10;
        });
      }

      enemyBullets.forEach(b => b.y += b.speed);
      enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

      playerBullets.forEach(b => {
        singleEnemies.forEach(e => {
          if (!e.alive) return;
          if (rectHit(b, e)) {
            e.alive = false;
            b.y = -100;
            singleScore += 10;
            addParticles(e.x + 12, e.y + 12, "#ff74c8", 10);
            dropItem(e.x + 4, e.y + 4);
            playHitSound();
          }
        });
      });

      if (singleInvincible <= 0) {
        enemyBullets.forEach(b => {
          if (rectHit(b, singlePlayer)) {
            b.y = canvas.height + 50;
            singleHp -= 20;
            singleInvincible = 60;
            addParticles(singlePlayer.x + 16, singlePlayer.y + 16, "#ff6464", 12);
            playHitSound();
            messageEl.textContent = "PLAYER HIT";

            if (singleHp <= 0) {
              singleLives--;
              singleHp = 100;
              singleInvincible = 90;
              messageEl.textContent = "LIFE LOST";

              if (singleLives <= 0) {
                gameState = "single_gameover";
                resultTimer = 180;
                playLoseSound();
                messageEl.textContent = `GAME OVER / SCORE ${singleScore}`;
              }
            }
          }
        });
      }

      updateItems();

      if (singleEnemies.every(e => !e.alive)) {
        createEnemyGrid();
        singleScore += 100;
        singleSpecial = Math.min(singleSpecial + 1, 5);
        messageEl.textContent = "WAVE CLEAR";
      }
    }

    function applyRankResult(win) {
      const beforeRank = getCurrentRank(rankData.rp);
      let delta = 0;

      if (win) {
        delta = 20 + Math.min(rankData.streak * 2, 10);
        rankData.wins++;
        rankData.streak++;
      } else {
        delta = -12;
        rankData.loses++;
        rankData.streak = 0;
      }

      rankData.rp = Math.max(0, rankData.rp + delta);
      saveRankData();

      const afterRank = getCurrentRank(rankData.rp);
      normalVs.rpDelta = delta;

      if (afterRank.name !== beforeRank.name && win) {
        messageEl.textContent = `RANK UP! ${afterRank.name}`;
      } else if (afterRank.name !== beforeRank.name && !win) {
        messageEl.textContent = `RANK DOWN! ${afterRank.name}`;
      } else {
        messageEl.textContent = win ? `RP +${delta}` : `RP ${delta}`;
      }
    }

    function updateNormalVsMode() {
      updateBackground();
      normalVs.battleTimer++;

      if (normalVs.result === null) {
        normalVs.timer -= 0.02;
        if (normalVs.timer < 0) normalVs.timer = 0;

        if (keys["ArrowLeft"] && normalVs.leftX > 50) normalVs.leftX -= 3.2;
        if (keys["ArrowRight"] && normalVs.leftX < 350) normalVs.leftX += 3.2;

        normalVs.rightX += Math.sin(Date.now() * 0.002) * 0.8;
        normalVs.rightY += Math.cos(Date.now() * 0.0024) * 0.7;

        if (keys["Space"] || keys["KeyZ"]) {
          normalVs.rightHp -= 0.5;
          normalVs.leftGauge = Math.min(100, normalVs.leftGauge + 0.6);
        }

        normalVs.leftGauge = Math.max(0, normalVs.leftGauge - 0.03);
        normalVs.rightGauge = 20 + ((Math.cos(Date.now() * 0.0022) + 1) * 35);

        if (normalVs.battleTimer % 12 === 0) {
          normalVs.leftHp -= Math.random() < 0.42 ? 0 : 0.4;
          normalVs.rightHp -= Math.random() < 0.55 ? 0 : 0.7;
        }

        if (normalVs.leftHp <= 0 || normalVs.rightHp <= 0 || normalVs.timer <= 0) {
          const win = normalVs.rightHp <= 0 || normalVs.leftHp > normalVs.rightHp;
          normalVs.result = win ? "WIN" : "LOSE";
          applyRankResult(win);
          resultTimer = 180;
          if (win) playWinSound(); else playLoseSound();
        }
      } else {
        resultTimer--;
        if (resultTimer <= 0) {
          startVsMenu();
        }
      }
    }

    function updateRoomWaitMode() {
      updateBackground();
      roomWaitData.blink++;

      if (roomWaitData.hostName === playerName) {
        roomWaitData.guestName = roomWaitData.blink > 150 ? "RIVAL PLAYER" : "WAITING...";
        if (roomWaitData.blink > 150) {
          roomWaitData.guestReady = Math.floor(roomWaitData.blink / 50) % 2 === 0;
        }
      }
    }

    function updateRoomBattleMode() {
      updateBackground();

      roomBattleData.timer -= 0.02;
      if (roomBattleData.timer < 0) roomBattleData.timer = 99;

      if (keys["ArrowLeft"] && roomBattleData.leftX > 50) roomBattleData.leftX -= 3.2;
      if (keys["ArrowRight"] && roomBattleData.leftX < 350) roomBattleData.leftX += 3.2;

      roomBattleData.rightX += Math.sin(Date.now() * 0.0023) * 0.8;
      roomBattleData.rightY += Math.cos(Date.now() * 0.0025) * 0.7;
      roomBattleData.leftGauge = 25 + ((Math.sin(Date.now() * 0.0025) + 1) * 30);
      roomBattleData.rightGauge = 20 + ((Math.cos(Date.now() * 0.0021) + 1) * 33);
    }

    function update() {
      if (gameState === "title" || gameState === "vs_menu" || gameState === "room_menu" || gameState === "paused") {
        updateBackground();
      } else if (gameState === "single") {
        updateSingleMode();
      } else if (gameState === "single_gameover") {
        updateBackground();
        updateParticles();
        resultTimer--;
        if (resultTimer <= 0) gameState = "title";
      } else if (gameState === "normal_vs") {
        updateNormalVsMode();
      } else if (gameState === "room_wait") {
        updateRoomWaitMode();
      } else if (gameState === "room_battle") {
        updateRoomBattleMode();
      }
    }

    function drawRankBadge(x, y, size, rank) {
      ctx.save();
      ctx.translate(x, y);

      const c = rank.color;
      const a = rank.accent;

      ctx.shadowBlur = 12;
      ctx.shadowColor = c;

      if (rank.shape === "hex") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size * 0.86, -size * 0.5);
        ctx.lineTo(size * 0.86, size * 0.5);
        ctx.lineTo(0, size);
        ctx.lineTo(-size * 0.86, size * 0.5);
        ctx.lineTo(-size * 0.86, -size * 0.5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = a;
        ctx.fillRect(-3, -3, 6, 6);
      }
      else if (rank.shape === "bronze") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size, -size * 0.2);
        ctx.lineTo(size * 0.6, size);
        ctx.lineTo(-size * 0.6, size);
        ctx.lineTo(-size, -size * 0.2);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = a;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(0, 8);
        ctx.lineTo(8, 0);
        ctx.stroke();
      }
      else if (rank.shape === "shield") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size, -size * 0.2);
        ctx.lineTo(size * 0.7, size * 0.7);
        ctx.lineTo(0, size);
        ctx.lineTo(-size * 0.7, size * 0.7);
        ctx.lineTo(-size, -size * 0.2);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = a;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-6, -2);
        ctx.lineTo(-6, 8);
        ctx.moveTo(6, -2);
        ctx.lineTo(6, 8);
        ctx.stroke();
      }
      else if (rank.shape === "crown") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(-size, size * 0.7);
        ctx.lineTo(-size * 0.7, -size * 0.6);
        ctx.lineTo(0, 0);
        ctx.lineTo(size * 0.7, -size * 0.6);
        ctx.lineTo(size, size * 0.7);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = a;
        ctx.beginPath();
        ctx.arc(0, -2, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      else if (rank.shape === "crystal") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size * 0.7, 0);
        ctx.lineTo(0, size);
        ctx.lineTo(-size * 0.7, 0);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = a;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(0, size);
        ctx.moveTo(-size * 0.7, 0);
        ctx.lineTo(size * 0.7, 0);
        ctx.stroke();
      }
      else if (rank.shape === "diamond") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size, 0);
        ctx.lineTo(0, size);
        ctx.lineTo(-size, 0);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = a;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(0, size);
        ctx.moveTo(-size, 0);
        ctx.lineTo(size, 0);
        ctx.moveTo(-size * 0.45, -size * 0.45);
        ctx.lineTo(size * 0.45, size * 0.45);
        ctx.stroke();
      }
      else if (rank.shape === "winged") {
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size * 0.7, -size * 0.2);
        ctx.lineTo(size * 0.5, size * 0.9);
        ctx.lineTo(-size * 0.5, size * 0.9);
        ctx.lineTo(-size * 0.7, -size * 0.2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = a;
        ctx.beginPath();
        ctx.arc(0, -2, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = a;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-size * 1.05, 0);
        ctx.lineTo(-size * 0.35, -4);
        ctx.moveTo(size * 1.05, 0);
        ctx.lineTo(size * 0.35, -4);
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw() {
      drawBackground();

      if (gameState === "title") {
        drawTitleMenu();
      } else if (gameState === "vs_menu") {
        drawVsMenu();
      } else if (gameState === "room_menu") {
        drawRoomMenu();
      } else if (gameState === "single") {
        drawSingleMode();
      } else if (gameState === "single_gameover") {
        drawSingleGameOver();
      } else if (gameState === "normal_vs") {
        drawNormalVsMode();
      } else if (gameState === "room_wait") {
        drawRoomWaitMode();
      } else if (gameState === "room_battle") {
        drawRoomBattleMode();
      } else if (gameState === "paused") {
        if (previousStateBeforePause === "single") drawSingleMode();
        else if (previousStateBeforePause === "normal_vs") drawNormalVsMode();
        else if (previousStateBeforePause === "room_wait") drawRoomWaitMode();
        else if (previousStateBeforePause === "room_battle") drawRoomBattleMode();
        drawPauseOverlay();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function confirmCurrentMenu() {
      unlockAudioOnce();

      if (gameState === "title") {
        playDecisionSound();
        if (titleMenuIndex === 0) startSingleMode();
        else if (titleMenuIndex === 1) startVsMenu();
        else if (titleMenuIndex === 2) startRoomMenu();
      }
      else if (gameState === "vs_menu") {
        playDecisionSound();
        if (vsMenuIndex === 0) startNormalMatch();
        else if (vsMenuIndex === 1) startRoomMenu();
        else if (vsMenuIndex === 2) gameState = "title";
      }
      else if (gameState === "room_menu") {
        playDecisionSound();
        if (roomMenuIndex === 0) createRoomFlow();
        else if (roomMenuIndex === 1) joinRoomFlow();
        else if (roomMenuIndex === 2) startVsMenu();
      }
      else if (gameState === "paused") {
        playDecisionSound();
        if (pauseMenuIndex === 0) resumeGame();
        else if (pauseMenuIndex === 1) retryCurrentMode();
        else if (pauseMenuIndex === 2) gameState = "title";
      }
      else if (gameState === "room_wait") {
        if (roomWaitData.hostReady && roomWaitData.guestName !== "WAITING...") {
          startRoomBattleDemo();
        } else {
          messageEl.textContent = "WAIT READY / WAIT PLAYER";
          playCursorSound();
        }
      }
    }

    function menuMove(dir) {
      if (gameState === "title") {
        titleMenuIndex = moveMenu(titleMenuIndex, 0, 2, dir);
        playCursorSound();
      } else if (gameState === "vs_menu") {
        vsMenuIndex = moveMenu(vsMenuIndex, 0, 2, dir);
        playCursorSound();
      } else if (gameState === "room_menu") {
        roomMenuIndex = moveMenu(roomMenuIndex, 0, 2, dir);
        playCursorSound();
      } else if (gameState === "paused") {
        pauseMenuIndex = moveMenu(pauseMenuIndex, 0, 2, dir);
        playCursorSound();
      }
    }

    function handleActionButton() {
      unlockAudioOnce();

      if (gameState === "single") {
        const now = Date.now();
        if (now - singleLastShot > 180) {
          playerBullets.push({
            x: singlePlayer.x + singlePlayer.width / 2 - 2,
            y: singlePlayer.y - 8,
            width: 4,
            height: 12,
            speed: 8
          });
          singleLastShot = now;
          playShootSound();
        }
      } else if (gameState === "room_wait") {
        roomWaitData.hostReady = !roomWaitData.hostReady;
        playDecisionSound();
      }
    }

    function handleSpecialButton() {
      unlockAudioOnce();

      if (gameState === "single" && singleSpecial > 0) {
        singleSpecial--;
        singleEnemies.forEach(e => {
          if (e.alive) {
            e.alive = false;
            dropItem(e.x + 4, e.y + 4);
            addParticles(e.x + 12, e.y + 12, "#ffe57e", 10);
          }
        });
        playSpecialSound();
        messageEl.textContent = "SPECIAL BLAST";
      }
    }

    function handleOkButton() {
      unlockAudioOnce();
      confirmCurrentMenu();
    }

    function handlePauseToggle() {
      unlockAudioOnce();
      if (["single","normal_vs","room_wait","room_battle"].includes(gameState)) {
        pauseGame();
      } else if (gameState === "paused") {
        resumeGame();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft","ArrowRight","Enter","Space","KeyZ","KeyX","KeyP","Escape"].includes(e.code)) {
        e.preventDefault();
      }

      unlockAudioOnce();
      keys[e.code] = true;

      if (["title","vs_menu","room_menu","paused"].includes(gameState)) {
        if (e.code === "ArrowLeft") menuMove(-1);
        if (e.code === "ArrowRight") menuMove(1);
        if (e.code === "Enter") handleOkButton();
      }
      else if (["single","normal_vs","room_wait","room_battle"].includes(gameState)) {
        if (e.code === "KeyP" || e.code === "Escape") handlePauseToggle();
        if (e.code === "KeyX") handleSpecialButton();
        if (e.code === "Enter") handleOkButton();
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    function bindHoldButton(button, code) {
      button.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        unlockAudioOnce();
        keys[code] = true;
      });
      button.addEventListener("pointerup", (e) => {
        e.preventDefault();
        keys[code] = false;
      });
      button.addEventListener("pointercancel", () => keys[code] = false);
      button.addEventListener("pointerleave", () => keys[code] = false);
    }

    bindHoldButton(leftBtn, "ArrowLeft");
    bindHoldButton(rightBtn, "ArrowRight");

    actionBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleActionButton();
    });

    specialBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleSpecialButton();
    });

    okBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleOkButton();
    });

    pauseBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handlePauseToggle();
    });

    loadPlayerData();
    createBackground();
    gameLoop();
  </script>
</body>
</html>
